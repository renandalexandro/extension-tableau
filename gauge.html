<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gauge Visual</title>
  <script src="https://public.tableau.com/javascripts/api/tableau.extensions.1.latest.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #app {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    #gauge-wrapper {
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #gauge-svg { width: 100%; height: 100%; display: block; }
    #labels-row {
      display: flex;
      justify-content: space-between;
      width: 82%;
      font-size: clamp(9px, 1vw, 12px);
      color: #999;
      margin-top: 2px;
    }
    #debug {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff3cd;
      color: #333;
      font-size: 10px;
      padding: 4px 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="gauge-wrapper">
    <svg id="gauge-svg" viewBox="0 0 220 125"
         preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg">
      <path id="arc-bg"
        d="M 15 113 A 95 95 0 0 1 205 113"
        fill="none" stroke="#DCDCDC" stroke-width="18" stroke-linecap="round"/>
      <path id="arc-fill" d=""
        fill="none" stroke="#5B9BD5" stroke-width="18" stroke-linecap="round"/>
      <text id="text-value" x="110" y="88" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="15" font-weight="700" fill="#222">— | —</text>
      <text id="text-target" x="110" y="106" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" fill="#666">Target: —</text>
    </svg>
    <div id="labels-row"><span>0%</span><span>100%</span></div>
  </div>
</div>
<div id="debug">Iniciando...</div>

<script>
  const dbg = document.getElementById('debug');
  function setDebug(msg) { dbg.style.display='block'; dbg.textContent = msg; }
  function hideDebug()   { dbg.style.display='none'; }

  // ── Geometria ─────────────────────────────────────────────────────────────
  const CX = 110, CY = 113, R = 95;
  function polarXY(deg) {
    const rad = deg * Math.PI / 180;
    return { x: CX + R * Math.cos(rad), y: CY - R * Math.sin(rad) };
  }
  function arcPath(startDeg, endDeg) {
    const s = polarXY(startDeg), e = polarXY(endDeg);
    const large = Math.abs(endDeg - startDeg) > 180 ? 1 : 0;
    return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
  }

  // ── Formatação ────────────────────────────────────────────────────────────
  function fmt(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    const a = Math.abs(v);
    if (a >= 1e9) return (v/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
    if (a >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    if (a >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
    return v.toFixed(0);
  }
  function parseNum(cell) {
    if (!cell) return null;
    // Tenta .value direto
    const n = parseFloat(String(cell.value).replace(',','.'));
    if (!isNaN(n)) return n;
    // Tenta formattedValue removendo símbolos
    const s = String(cell.formattedValue).replace(/[^\d.,-]/g,'').replace(',','.');
    const n2 = parseFloat(s);
    return isNaN(n2) ? null : n2;
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render(valueNum, targetNum, pctNum) {
    let pct = pctNum;
    if (pct === null || pct === undefined) {
      pct = (targetNum && targetNum > 0) ? valueNum / targetNum : 0;
    } else if (pct > 1) {
      pct = pct / 100;
    }
    pct = Math.min(Math.max(pct || 0, 0), 1);

    const endDeg = 180 - pct * 180;
    const arcFill = document.getElementById('arc-fill');
    if (pct > 0.005) {
      arcFill.setAttribute('d', arcPath(180, endDeg));
      arcFill.style.display = '';
    } else {
      arcFill.style.display = 'none';
    }
    document.getElementById('text-value').textContent =
      fmt(valueNum) + ' | ' + (pct * 100).toFixed(0) + '%';
    document.getElementById('text-target').textContent =
      'Target: ' + fmt(targetNum);
    hideDebug();
  }

  // ── Lê dados — abordagem direta por posição de coluna ────────────────────
  // O Tableau retorna as colunas exatamente na ordem dos tiles A, B, C, D.
  // Não depende de getVisualSpecificationAsync (que pode falhar com AGG()).
  async function loadData() {
    try {
      const ws = tableau.extensions.worksheetContent.worksheet;
      setDebug('Conectado: ' + ws.name + ' — lendo dados...');

      let columns, allRows;

      // Tenta reader (mais eficiente)
      try {
        const reader = await ws.getSummaryDataReaderAsync();
        const page   = await reader.getPageAsync(0, 1);
        await reader.releaseAsync();
        columns = page.columns;
        allRows = page.data;
      } catch(e) {
        // Fallback para getSummaryDataAsync
        setDebug('Usando fallback getSummaryDataAsync...');
        const dt = await ws.getSummaryDataAsync();
        columns  = dt.columns;
        allRows  = dt.data;
      }

      if (!allRows || allRows.length === 0) {
        setDebug('Nenhum dado retornado. Verifique se os campos estão nos tiles A, B, C.');
        return;
      }

      const firstRow = allRows[0];

      // Log completo para diagnóstico
      const colInfo = columns.map((c, i) => `[${i}]${c.fieldName}=${firstRow[i]?.value}`).join('  ');
      setDebug(colInfo);

      // Pega por posição: tile A=0, tile B=1, tile C=2
      // (ordem garantida pelo Tableau para Viz Extensions)
      const valueNum  = parseNum(firstRow[0]);
      const targetNum = parseNum(firstRow[1]);
      const pctNum    = parseNum(firstRow[2]);

      setDebug(`v=${valueNum} | t=${targetNum} | p=${pctNum}`);

      render(valueNum, targetNum, pctNum);

    } catch(err) {
      setDebug('ERRO: ' + err.message);
    }
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  setDebug('Aguardando initializeAsync...');

  tableau.extensions.initializeAsync()
    .then(() => {
      setDebug('API inicializada. Carregando dados...');
      loadData();
      tableau.extensions.worksheetContent.worksheet.addEventListener(
        tableau.TableauEventType.SummaryDataChanged, loadData
      );
    })
    .catch(err => {
      setDebug('Fora do Tableau: ' + (err.message || String(err)));
    });
</script>
</body>
</html>
