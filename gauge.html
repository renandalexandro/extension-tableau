<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gauge Visual</title>
  <script src="https://public.tableau.com/javascripts/api/tableau.extensions.1.latest.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
    }
    #title {
      font-size: 13px;
      font-weight: 700;
      color: #222;
      margin-bottom: 8px;
      text-align: center;
    }
    #gauge-wrapper { position: relative; width: 220px; }
    #gauge-svg { display: block; width: 100%; overflow: visible; }
    #labels-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 2px;
      padding: 0 4px;
    }
    .edge-label { font-size: 10px; color: #999; }
    #debug {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff3cd;
      color: #333;
      font-size: 10px;
      padding: 4px 8px;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="title">—</div>
  <div id="gauge-wrapper">
    <svg id="gauge-svg" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">
      <path id="arc-bg"
        d="M 25 110 A 85 85 0 0 1 195 110"
        fill="none" stroke="#DCDCDC" stroke-width="20" stroke-linecap="round"/>
      <path id="arc-fill" d=""
        fill="none" stroke="#5B9BD5" stroke-width="20" stroke-linecap="round"/>
      <text id="text-value" x="110" y="90" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#222">— | —</text>
      <text id="text-target" x="110" y="106" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#666">Target: —</text>
    </svg>
    <div id="labels-row">
      <span class="edge-label">0%</span>
      <span class="edge-label">100%</span>
    </div>
  </div>
</div>

<div id="debug">Iniciando...</div>

<script>
  // ─── Debug ────────────────────────────────────────────────────────────────
  const logs = [];
  function log(msg) {
    console.log(msg);
    logs.push(msg);
    document.getElementById('debug').textContent = logs.join(' | ');
  }

  // ─── Geometria ────────────────────────────────────────────────────────────
  const CX = 110, CY = 110, R = 85;
  function polarXY(deg) {
    const rad = deg * Math.PI / 180;
    return { x: CX + R * Math.cos(rad), y: CY - R * Math.sin(rad) };
  }
  function arcPath(startDeg, endDeg) {
    const s = polarXY(startDeg), e = polarXY(endDeg);
    const large = Math.abs(endDeg - startDeg) > 180 ? 1 : 0;
    return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
  }
  function fmt(v) {
    if (v === null || isNaN(v)) return '—';
    const a = Math.abs(v);
    if (a >= 1e9) return (v/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
    if (a >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    if (a >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
    return v.toFixed(0);
  }
  function parseNum(cell) {
    if (!cell) return null;
    const n = parseFloat(String(cell.value).replace(',', '.'));
    if (!isNaN(n)) return n;
    const s = String(cell.formattedValue).replace(/[^\d.,-]/g, '').replace(',', '.');
    const n2 = parseFloat(s);
    return isNaN(n2) ? null : n2;
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function render(valueNum, targetNum, pctNum) {
    let pct = pctNum;
    if (pct === null) {
      pct = (targetNum && targetNum > 0) ? valueNum / targetNum : 0;
    } else if (pct > 1) {
      pct = pct / 100;
    }
    pct = Math.min(Math.max(pct || 0, 0), 1);

    const endDeg = 180 - pct * 180;
    const arcFill = document.getElementById('arc-fill');
    if (pct > 0.005) {
      arcFill.setAttribute('d', arcPath(180, endDeg));
      arcFill.style.display = '';
    } else {
      arcFill.style.display = 'none';
    }
    document.getElementById('text-value').textContent =
      fmt(valueNum) + ' | ' + (pct * 100).toFixed(0) + '%';
    document.getElementById('text-target').textContent =
      'Target: ' + fmt(targetNum);
  }

  // ─── Carrega dados ────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const ws = tableau.extensions.worksheetContent.worksheet;
      log('ws=' + ws.name);

      // — Lê dados brutos primeiro —
      let columns, allRows;
      try {
        const reader = await ws.getSummaryDataReaderAsync();
        const page   = await reader.getPageAsync(0, 1);
        await reader.releaseAsync();
        columns = page.columns;
        allRows = page.data;
      } catch(e) {
        log('reader err:' + e.message + ' -> fallback');
        const dt = await ws.getSummaryDataAsync();
        columns = dt.columns;
        allRows = dt.data;
      }

      log('cols=' + columns.map(c => c.fieldName).join(';'));

      if (!allRows || allRows.length === 0) {
        log('SEM DADOS');
        return;
      }

      const firstRow = allRows[0];
      log('row[0]=' + firstRow.map(c => c.value).join(';'));

      // — Tenta visual spec para pegar encoding —
      let encField = {};
      try {
        const spec  = await ws.getVisualSpecificationAsync();
        const marks = spec.marksSpecifications[spec.activeMarksSpecificationIndex];
        for (const enc of marks.encodings) {
          if (enc.field) encField[enc.id] = enc.field.name;
        }
        log('enc=' + JSON.stringify(encField));
      } catch(e) {
        log('spec err:' + e.message);
      }

      // Mapa coluna → índice (tenta nome exato e com prefixo AGG())
      const colIdx = {};
      columns.forEach((c, i) => { colIdx[c.fieldName] = i; });

      function findCell(encId) {
        const fieldName = encField[encId];
        if (!fieldName) return null;
        // 1. exato
        if (colIdx[fieldName] !== undefined) return firstRow[colIdx[fieldName]];
        // 2. AGG(nome)
        const agg = 'AGG(' + fieldName + ')';
        if (colIdx[agg] !== undefined) return firstRow[colIdx[agg]];
        // 3. parcial
        const key = Object.keys(colIdx).find(k => k.includes(fieldName));
        if (key) return firstRow[colIdx[key]];
        return null;
      }

      // — Fallback: se encoding vazio, usa posição das colunas diretamente —
      let valueCell, targetCell, pctCell, labelCell;

      if (Object.keys(encField).length > 0) {
        valueCell  = findCell('value');
        targetCell = findCell('target');
        pctCell    = findCell('pct');
        labelCell  = findCell('label');
      } else {
        // Sem encoding: tenta inferir por nome de coluna
        log('enc vazio - inferindo por nome de coluna');
        columns.forEach((c, i) => {
          const n = c.fieldName.toLowerCase();
          if (n.includes('actual') || n.includes('valor') || n.includes('actual')) valueCell  = firstRow[i];
          if (n.includes('target') || n.includes('meta'))                          targetCell = firstRow[i];
          if (n.includes('%') || n.includes('pct') || n.includes('percent'))       pctCell    = firstRow[i];
          if (n.includes('label') || n.includes('titulo') || n.includes('title'))  labelCell  = firstRow[i];
        });
      }

      const valueNum  = parseNum(valueCell);
      const targetNum = parseNum(targetCell);
      const pctNum    = parseNum(pctCell);
      const labelText = labelCell ? labelCell.formattedValue : (encField['label'] || '');

      log(`v=${valueNum} t=${targetNum} p=${pctNum} l=${labelText}`);

      if (labelText) document.getElementById('title').textContent = labelText;
      render(valueNum, targetNum, pctNum);

    } catch(err) {
      log('ERRO GERAL: ' + err.message);
    }
  }

  // ─── Boot ─────────────────────────────────────────────────────────────────
  tableau.extensions.initializeAsync().then(() => {
    log('init OK');
    loadData();
    tableau.extensions.worksheetContent.worksheet.addEventListener(
      tableau.TableauEventType.SummaryDataChanged, loadData
    );
  }).catch(err => {
    log('INIT FAIL: ' + (err.message || String(err)));
  });
</script>
</body>
</html>
